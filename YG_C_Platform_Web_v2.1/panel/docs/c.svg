<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="1400" height="900" fill="#f8f9fa" />

    <!-- 标题 -->
    <text x="700" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        text-anchor="middle" fill="#2c3e50">AI智能台灯学习模式切换执行链路</text>

    <!-- 泳道标题 -->
    <rect x="100" y="80" width="200" height="50" rx="5" fill="#e3f2fd" stroke="#2196f3"
        stroke-width="2" />
    <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#1976d2">用户交互</text>

    <rect x="350" y="80" width="200" height="50" rx="5" fill="#f3e5f5" stroke="#9c27b0"
        stroke-width="2" />
    <text x="450" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#7b1fa2">UI组件</text>

    <rect x="600" y="80" width="200" height="50" rx="5" fill="#fff3e0" stroke="#ff9800"
        stroke-width="2" />
    <text x="700" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#f57c00">API请求层</text>

    <rect x="850" y="80" width="200" height="50" rx="5" fill="#ffebee" stroke="#f44336"
        stroke-width="2" />
    <text x="950" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#d32f2f">Store/状态</text>

    <rect x="1100" y="80" width="200" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50"
        stroke-width="2" />
    <text x="1200" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#388e3c">视图渲染</text>

    <!-- 垂直线 -->
    <line x1="200" y1="130" x2="200" y2="850" stroke="#2196f3" stroke-width="2"
        stroke-dasharray="5,5" />
    <line x1="450" y1="130" x2="450" y2="850" stroke="#9c27b0" stroke-width="2"
        stroke-dasharray="5,5" />
    <line x1="700" y1="130" x2="700" y2="850" stroke="#ff9800" stroke-width="2"
        stroke-dasharray="5,5" />
    <line x1="950" y1="130" x2="950" y2="850" stroke="#f44336" stroke-width="2"
        stroke-dasharray="5,5" />
    <line x1="1200" y1="130" x2="1200" y2="850" stroke="#4caf50" stroke-width="2"
        stroke-dasharray="5,5" />

    <!-- 步骤1：用户点击开关 -->
    <rect x="120" y="150" width="160" height="50" rx="8" fill="#ffffff" stroke="#2196f3"
        stroke-width="2" />
    <text x="200" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
        fill="#333">点击学习模式开关</text>

    <!-- 步骤2：AiLampSwitch组件 -->
    <rect x="380" y="150" width="140" height="50" rx="8" fill="#ffffff" stroke="#9c27b0"
        stroke-width="2" />
    <text x="450" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
        fill="#333">AiLampSwitch.onClick()</text>

    <!-- 箭头1 -->
    <line x1="280" y1="175" x2="380" y2="175" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤3：emit click事件 -->
    <rect x="380" y="220" width="140" height="50" rx="8" fill="#ffffff" stroke="#9c27b0"
        stroke-width="2" />
    <text x="450" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
        fill="#333">emit('click')</text>

    <!-- 箭头2 -->
    <line x1="450" y1="200" x2="450" y2="220" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤4：HomeView onToggleStudy -->
    <rect x="350" y="290" width="200" height="70" rx="8" fill="#ffffff" stroke="#9c27b0"
        stroke-width="2" />
    <text x="450" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#333">HomeView.onToggleStudy()</text>
    <text x="450" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">studySwitchLoading = true</text>

    <!-- 箭头3 -->
    <line x1="450" y1="270" x2="450" y2="290" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤5：调用sendCustomEvent API -->
    <rect x="600" y="290" width="200" height="70" rx="8" fill="#ffffff" stroke="#ff9800"
        stroke-width="2" />
    <text x="700" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#333">sendCustomEvent()</text>
    <text x="700" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">params: {pid, did, event}</text>

    <!-- 箭头4 -->
    <line x1="550" y1="325" x2="600" y2="325" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤6：axios request -->
    <rect x="600" y="390" width="200" height="70" rx="8" fill="#ffffff" stroke="#ff9800"
        stroke-width="2" />
    <text x="700" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#333">utils/request.get()</text>
    <text x="700" y="445" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">url: app/api/agora/sendCustomEvent</text>

    <!-- 箭头5 -->
    <line x1="700" y1="360" x2="700" y2="390" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤7：后端处理（示意） -->
    <rect x="600" y="490" width="200" height="60" rx="8" fill="#fff3e0" stroke="#ff9800"
        stroke-width="2" />
    <text x="700" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
        fill="#333">后端API处理请求</text>

    <!-- 箭头6 -->
    <line x1="700" y1="460" x2="700" y2="490" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤8：设备数据变化回调 -->
    <rect x="850" y="490" width="200" height="70" rx="8" fill="#ffffff" stroke="#f44336"
        stroke-width="2" />
    <text x="950" y="520" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#333">onDeviceDataChange()</text>
    <text x="950" y="545" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">data.studyMonitor_StudyMode更新</text>

    <!-- 箭头7 -->
    <line x1="800" y1="525" x2="850" y2="525" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤9：computed isStudying更新 -->
    <rect x="850" y="590" width="200" height="70" rx="8" fill="#ffffff" stroke="#f44336"
        stroke-width="2" />
    <text x="950" y="620" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#333">computed: isStudying</text>
    <text x="950" y="645" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">响应式更新为true/false</text>

    <!-- 箭头8 -->
    <line x1="950" y1="560" x2="950" y2="590" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤10：studySwitchLoading = false -->
    <rect x="350" y="590" width="200" height="50" rx="8" fill="#ffffff" stroke="#9c27b0"
        stroke-width="2" />
    <text x="450" y="620" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
        fill="#333">studySwitchLoading = false</text>

    <!-- 箭头9 -->
    <line x1="800" y1="600" x2="550" y2="600" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤11：AiLampSwitch状态更新 -->
    <rect x="380" y="670" width="140" height="50" rx="8" fill="#ffffff" stroke="#9c27b0"
        stroke-width="2" />
    <text x="450" y="700" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"
        fill="#333">AiLampSwitch.props更新</text>

    <!-- 箭头10 -->
    <line x1="450" y1="640" x2="450" y2="670" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 步骤12：视图响应式渲染 -->
    <rect x="1100" y="670" width="200" height="90" rx="8" fill="#ffffff" stroke="#4caf50"
        stroke-width="2" />
    <text x="1200" y="700" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#333">视图响应式渲染</text>
    <text x="1200" y="725" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">1. 开关状态(is-on/is-off)</text>
    <text x="1200" y="745" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#666">2. 状态标签颜色变化</text>

    <!-- 箭头11 -->
    <line x1="520" y1="700" x2="1100" y2="700" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 箭头12：isStudying到视图 -->
    <line x1="1050" y1="625" x2="1100" y2="700" stroke="#666" stroke-width="2"
        marker-end="url(#arrow)" />

    <!-- 数据流动标注 -->
    <rect x="100" y="800" width="1200" height="70" rx="8" fill="#ecfdf5" stroke="#059669"
        stroke-width="2" />
    <text x="700" y="830" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#059669">核心数据流：用户点击 → API调用 → 设备数据回调 → 状态更新 → 视图重新渲染</text>
    <text x="700" y="855" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#666">关键变量：isStudying (computed)、studySwitchLoading (ref)、data.studyMonitor_StudyMode
        (响应式状态)</text>

    <!-- 箭头定义 -->
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
        </marker>
    </defs>
</svg>