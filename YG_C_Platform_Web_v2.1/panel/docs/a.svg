<svg width="1200" height="1000" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="1200" height="1000" fill="#f5f5f5" />

    <!-- 标题 -->
    <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        text-anchor="middle" fill="#333">私有云 H5 前端项目架构图</text>

    <!-- 组件层 (UI) -->
    <rect x="50" y="100" width="1100" height="180" rx="8" fill="#e3f2fd" stroke="#2196f3"
        stroke-width="2" />
    <text x="600" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#1976d2">组件层 (UI)</text>

    <!-- 组件层模块 -->
    <rect x="80" y="150" width="150" height="80" rx="5" fill="#bbdefb" stroke="#1976d2"
        stroke-width="1" />
    <text x="155" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#1565c0">AILamp 模块</text>
    <text x="155" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">智能台灯控制与学习功能</text>

    <rect x="250" y="150" width="150" height="80" rx="5" fill="#bbdefb" stroke="#1976d2"
        stroke-width="1" />
    <text x="325" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#1565c0">AIClock 模块</text>
    <text x="325" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">AI 闹钟与定时管理</text>

    <rect x="420" y="150" width="150" height="80" rx="5" fill="#bbdefb" stroke="#1976d2"
        stroke-width="1" />
    <text x="495" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#1565c0">AUPU 灯具系列</text>
    <text x="495" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">多型号智能灯具控制</text>

    <rect x="590" y="150" width="150" height="80" rx="5" fill="#bbdefb" stroke="#1976d2"
        stroke-width="1" />
    <text x="665" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#1565c0">智能家居模块</text>
    <text x="665" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">空调、窗帘、风扇控制</text>

    <rect x="760" y="150" width="150" height="80" rx="5" fill="#bbdefb" stroke="#1976d2"
        stroke-width="1" />
    <text x="835" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#1565c0">通用组件</text>
    <text x="835" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">DeviceTop、SelectCard等</text>

    <rect x="930" y="150" width="150" height="80" rx="5" fill="#bbdefb" stroke="#1976d2"
        stroke-width="1" />
    <text x="1005" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#1565c0">App.vue</text>
    <text x="1005" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">根组件</text>

    <!-- 路由层 (Router) -->
    <rect x="50" y="320" width="1100" height="140" rx="8" fill="#f3e5f5" stroke="#9c27b0"
        stroke-width="2" />
    <text x="600" y="350" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#7b1fa2">路由层 (Router)</text>

    <rect x="280" y="370" width="640" height="70" rx="5" fill="#e1bee7" stroke="#7b1fa2"
        stroke-width="1" />
    <text x="600" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="#6a1b9a">Vue Router</text>
    <text x="600" y="420" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#333">hash 路由模式，设备页面路由管理</text>

    <!-- 状态管理层 (Store) -->
    <rect x="50" y="500" width="1100" height="160" rx="8" fill="#fff3e0" stroke="#ff9800"
        stroke-width="2" />
    <text x="600" y="530" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#f57c00">状态管理层 (Store)</text>

    <rect x="120" y="550" width="140" height="80" rx="5" fill="#ffe0b2" stroke="#f57c00"
        stroke-width="1" />
    <text x="190" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#e65100">Pinia</text>
    <text x="190" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">状态管理库</text>

    <rect x="280" y="550" width="140" height="80" rx="5" fill="#ffe0b2" stroke="#f57c00"
        stroke-width="1" />
    <text x="350" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#e65100">mode Store</text>
    <text x="350" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">灯具模式管理</text>

    <rect x="440" y="550" width="140" height="80" rx="5" fill="#ffe0b2" stroke="#f57c00"
        stroke-width="1" />
    <text x="510" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#e65100">time Store</text>
    <text x="510" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">定时任务管理</text>

    <rect x="600" y="550" width="140" height="80" rx="5" fill="#ffe0b2" stroke="#f57c00"
        stroke-width="1" />
    <text x="670" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#e65100">inteScene Store</text>
    <text x="670" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">场景联动管理</text>

    <rect x="760" y="550" width="140" height="80" rx="5" fill="#ffe0b2" stroke="#f57c00"
        stroke-width="1" />
    <text x="830" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#e65100">设备状态</text>
    <text x="830" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">status/info/data/initData</text>

    <rect x="920" y="550" width="140" height="80" rx="5" fill="#ffe0b2" stroke="#f57c00"
        stroke-width="1" />
    <text x="990" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#e65100">XJIotSDK</text>
    <text x="990" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">设备通信 SDK</text>

    <!-- API 请求层 (Service) -->
    <rect x="50" y="700" width="1100" height="140" rx="8" fill="#e8f5e9" stroke="#4caf50"
        stroke-width="2" />
    <text x="600" y="730" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#388e3c">API 请求层 (Service)</text>

    <rect x="200" y="750" width="160" height="70" rx="5" fill="#c8e6c9" stroke="#388e3c"
        stroke-width="1" />
    <text x="280" y="780" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#2e7d32">axios</text>
    <text x="280" y="798" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">HTTP 请求库</text>

    <rect x="380" y="750" width="160" height="70" rx="5" fill="#c8e6c9" stroke="#388e3c"
        stroke-width="1" />
    <text x="460" y="780" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#2e7d32">request</text>
    <text x="460" y="798" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">请求/响应拦截器</text>

    <rect x="560" y="750" width="160" height="70" rx="5" fill="#c8e6c9" stroke="#388e3c"
        stroke-width="1" />
    <text x="640" y="780" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#2e7d32">aiLamp API</text>
    <text x="640" y="798" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">AI 台灯业务 API</text>

    <rect x="740" y="750" width="160" height="70" rx="5" fill="#c8e6c9" stroke="#388e3c"
        stroke-width="1" />
    <text x="820" y="780" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#2e7d32">aiAlarm API</text>
    <text x="820" y="798" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"
        fill="#333">AI 闹钟业务 API</text>

    <!-- 基础设施 -->
    <rect x="50" y="880" width="1100" height="90" rx="8" fill="#fafafa" stroke="#757575"
        stroke-width="2" />
    <text x="600" y="910" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#616161">基础设施</text>

    <text x="200" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">Vite</text>
    <text x="300" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">Vue 3</text>
    <text x="400" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">TypeScript</text>
    <text x="500" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">Element Plus</text>
    <text x="600" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">Vue I18n</text>
    <text x="700" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">Tailwind CSS</text>
    <text x="800" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">ESLint</text>
    <text x="900" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"
        fill="#424242">Prettier</text>

    <!-- 箭头连接线 -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
        </marker>
    </defs>

    <line x1="600" y1="280" x2="600" y2="320" stroke="#666" stroke-width="2"
        marker-end="url(#arrowhead)" />
    <line x1="600" y1="460" x2="600" y2="500" stroke="#666" stroke-width="2"
        marker-end="url(#arrowhead)" />
    <line x1="600" y1="660" x2="600" y2="700" stroke="#666" stroke-width="2"
        marker-end="url(#arrowhead)" />
    <line x1="600" y1="840" x2="600" y2="880" stroke="#666" stroke-width="2"
        marker-end="url(#arrowhead)" />

</svg>